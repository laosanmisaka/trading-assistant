name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q --basetemp="${{ runner.temp }}/trading-assistant-pytest"
        env:
          CZSC_HOME: ${{ runner.temp }}/czsc
          MPLCONFIGDIR: ${{ runner.temp }}/mpl
      # This is the accepted pre-remediation baseline; historical evidence is immutable.
      - run: python scripts/check_standards.py --base 7fbaba88af71ef6cb8a25dc93d0939212b306a73
      - run: python scripts/check_docs.py
